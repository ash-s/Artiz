spring.application.name=kura-interiors-api
server.port=8080

# H2 In-Memory / File Database for zero-setup execution
spring.datasource.url=jdbc:h2:mem:artizdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=Admin@123

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (available at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# To switch to PostgreSQL in production:
# spring.datasource.url=jdbc:postgresql://localhost:5432/kuradb
# spring.datasource.username=postgres
# spring.datasource.password=secret
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
